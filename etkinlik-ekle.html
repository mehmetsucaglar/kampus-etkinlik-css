<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etkinlik Ekle</title>
  <link rel="stylesheet" href="css/2416501032.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Etkinlik Ekle</h1>
      <nav>
        <ul>
          <li><a href="index.html">Ana Sayfa</a></li>
          <li><a href="etkinlikler.html">Etkinlikler</a></li>
          <li><a href="etkinlik-ekle.html" class="active">Ekle</a></li>
          <li><a href="etkinlik-guncelle.html">Güncelle</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <form action="#" method="post">
        <div class="form-group">
          <label for="ad">Etkinlik adı</label>
          <input type="text" id="ad" name="ad">
        </div>

        <div class="form-group">
          <label for="kategori">Kategori</label>
          <select id="kategori" name="kategori">
            <option value="">Seçiniz</option>
            <option value="Seminer">Seminer</option>
            <option value="Atölye">Atölye</option>
            <option value="Söyleşi">Söyleşi</option>
          </select>
        </div>

        <div class="form-group">
          <label for="tarih">Tarih</label>
          <input type="text" id="tarih" name="tarih" class="is-invalid" placeholder="gg.aa.yyyy">
          <span class="error-text">boş bırakıldı</span>
        </div>

        <div class="form-group">
          <label for="aciklama">Açıklama</label>
          <textarea id="aciklama" name="aciklama" rows="4"></textarea>
        </div>

        <button type="submit" class="btn-primary">Kaydet</button>
      </form>
    </main>
  </div>
</body>
</html>
